name: Build & Test Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential
    
    - name: Build PikaJieQi Enhanced
      run: |
        cd src
        make -j$(nproc) ARCH=x86-64-sse41-popcnt build
        ls -la PikaJieQi
    
    - name: Download NNUE
      run: |
        cd src
        # Download NNUE from official Pikafish Networks repo (direct .nnue file)
        curl -sL "https://github.com/official-pikafish/Networks/releases/download/master-net/pikafish.nnue" -o pikafish.nnue
        ls -la pikafish.nnue
    
    - name: Test engine UCI
      run: |
        cd src
        echo -e "uci\nisready\nquit" | ./PikaJieQi | head -5
        echo "---"
        (echo -e "uci\nsetoption name EvalFile value pikafish.nnue\nisready\nposition startpos\ngo infinite"; sleep 3; echo "stop"; sleep 1; echo "quit") | ./PikaJieQi | grep bestmove
        echo "---"
        (echo -e "uci\nsetoption name EvalFile value pikafish.nnue\nisready\nposition startpos moves c3c4N\ngo infinite"; sleep 3; echo "stop"; sleep 1; echo "quit") | ./PikaJieQi | grep bestmove
    
    - name: Verify patches
      run: |
        cd src
        echo "=== Sigmoid aggregation ==="
        grep -c "sigmoid\|FLIP_SCALING\|winrateSum" misc.h
        echo "=== Chance branch reduction ==="
        grep -c "reveal_depth_reduction" search.cpp
        echo "=== Mate fix ==="
        grep -c "allDecisive\|bestWinMate" misc.h
    
    - name: Build JieqiArena
      run: |
        git clone --depth 1 https://github.com/Velithia/JieqiArena /tmp/arena
        cd /tmp/arena/src
        make
        ls -la jieqi_arena
    
    - name: Self-play test (1 round)
      run: |
        cd src
        echo -e "jai
        setoption name Engine1Path value $(pwd)/PikaJieQi
        setoption name Engine2Path value $(pwd)/PikaJieQi
        setoption name Engine1Options value name EvalFile value $(pwd)/pikafish.nnue
        setoption name Engine2Options value name EvalFile value $(pwd)/pikafish.nnue
        setoption name TotalRounds value 1
        setoption name MainTimeMs value 2000
        setoption name IncTimeMs value 0
        setoption name TimeoutBufferMs value 10000
        setoption name Concurrency value 1
        isready
        startmatch
        quit" | timeout 120 /tmp/arena/src/jieqi_arena 2>&1 | grep -E "info (result|wld|game|move)" | head -20
